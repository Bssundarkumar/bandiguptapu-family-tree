<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101b"><title>Bandiguptapu Family Tree</title><style>*{box-sizing:border-box}body{margin:0;background:#07101b;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.top{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#07101be8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff16}.head{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#f0cf8e,#a96e35);display:grid;place-items:center;color:#241507;font-weight:900}.title{font-weight:850}.sub,.muted{color:#94a0b4;font-size:12px}.search{width:100%;margin-top:10px;padding:13px 14px;border-radius:14px;border:1px solid #ffffff18;background:#ffffff0b;color:white;font-size:16px}.wrap{padding:14px 12px 100px}.hero{padding:18px;border:1px solid #e7bb6e40;border-radius:22px;background:linear-gradient(145deg,#17243a,#0e1725);box-shadow:0 18px 60px #0006}.hero h1{font-family:Georgia;margin:6px 0;font-size:25px}.chips{display:flex;gap:7px;overflow:auto;margin:14px 0}.chip{flex:0 0 auto;border:1px solid #ffffff18;background:#ffffff0b;color:#dbe3ee;padding:9px 12px;border-radius:999px}.chip.active{background:#e8bc72;color:#211506}.gen{margin:22px 0}.gen h3{font-size:12px;color:#e8bc72;text-transform:uppercase;letter-spacing:.12em}.row{display:flex;gap:10px;overflow:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.card{flex:0 0 min(78vw,300px);scroll-snap-align:center;text-align:left;color:white;border:1px solid #ffffff17;border-radius:18px;padding:15px;background:linear-gradient(145deg,#142033,#0d1624);min-height:105px}.card.sel{border-color:#e8bc72;box-shadow:0 0 0 2px #e8bc7218}.card b{display:block;font-size:16px}.card small{display:block;color:#94a0b4;margin-top:7px}.rels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:1px solid #ffffff18;background:#ffffff0b;color:white;padding:11px;border-radius:13px}.primary{background:linear-gradient(135deg,#efce8f,#b77b3e);color:#211506;font-weight:800}.nav{position:fixed;left:8px;right:8px;bottom:calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:#0d1726ed;border:1px solid #ffffff18;border-radius:20px;backdrop-filter:blur(20px)}.nav button{border:0;background:transparent;color:#aab4c3;padding:9px;border-radius:14px}.nav button:active{background:#ffffff12}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#101a29;border-radius:25px 25px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.sheet input,.sheet select,.sheet textarea{width:100%;margin:6px 0 10px;padding:12px;border-radius:12px;border:1px solid #ffffff18;background:#09121e;color:white;font-size:16px}.sheet textarea{min-height:90px}.actions{display:flex;gap:8px}.actions button{flex:1}@media(min-width:900px){.wrap{max-width:1100px;margin:auto}.card{flex-basis:260px}.hero{max-width:650px}.nav{width:420px;left:50%;right:auto;transform:translateX(-50%)}}</style></head><body><header class="top"><div class="head"><div class="logo">B</div><div><div class="title">Bandiguptapu Family</div><div class="sub">Generations • Heritage • Relationships</div></div></div><input id="search" class="search" placeholder="Search family…"></header><main class="wrap"><section id="hero" class="hero"></section><div id="chips" class="chips"></div><div id="tree"></div></main><nav class="nav"><button onclick="home()">⌂<br><small>My Branch</small></button><button onclick="document.querySelector('.sel')?.scrollIntoView({behavior:'smooth',block:'center'})">◎<br><small>Selected</small></button><button onclick="openAdd('child')">＋<br><small>Add Person</small></button></nav><div id="modal" class="modal"><form id="form" class="sheet"><h2 id="mt">Add person</h2><input id="name" required placeholder="Full name"><input id="surname" placeholder="Surname"><input id="dob" placeholder="Date / year of birth"><input id="place" placeholder="Birthplace / ancestral village"><input id="occupation" placeholder="Occupation / role"><input id="gotram" placeholder="Gotram"><input id="deity" placeholder="Family deity"><textarea id="notes" placeholder="Family history / notes"></textarea><select id="rel"><option value="child">Child of selected person</option><option value="parent">Parent of selected person</option><option value="spouse">Spouse of selected person</option><option value="none">No relationship yet</option></select><div class="actions"><button type="button" class="btn" onclick="closeAdd()">Cancel</button><button class="btn primary">Save</button></div></form></div><script>const KEY='bandiguptapu-family-v4';const seed=[{id:'chitti',n:'Chitti Venkanna',s:'Bandiguptapu',p:'Allavaram',o:'Ancestor',pa:[],sp:['subbamma'],ch:['subbarao']},{id:'subbamma',n:'Venkata Subbamma',s:'Merikela',p:'',o:'',pa:[],sp:['chitti'],ch:['subbarao']},{id:'subbarao',n:'Venkata Subbarao',s:'Bandiguptapu',d:'1929–2000',p:'Allavaram',o:'Teacher',pa:['chitti','subbamma'],sp:['manikyam'],ch:['satyanarayana']},{id:'manikyam',n:'Sundara Manikyam',s:'Motupalli',p:'',o:'',pa:[],sp:['subbarao'],ch:['satyanarayana']},{id:'satyanarayana',n:'Veera Venkata Satyanarayana',s:'Bandiguptapu',d:'08-Aug-1966',p:'Allavaram',o:'Sattibabu',pa:['subbarao','manikyam'],sp:['mani'],ch:['satya']},{id:'mani',n:'Naga Satya Mani',s:'Kankipati',p:'Allavaram',pa:[],sp:['satyanarayana'],ch:['satya']},{id:'satya',n:'Satya Sundar Kumar',s:'Bandiguptapu',p:'Allavaram, Andhra Pradesh, India',o:'M.S. (U.S.A.)',pa:['satyanarayana','mani'],sp:['sarada'],ch:['viransh'],g:'Kalsipala Sri Vatsa Gotram',de:'Masenekamma'},{id:'sarada',n:'Sarada Prasanna Lakshmi',s:'Chinta',pa:[],sp:['satya'],ch:['viransh']},{id:'viransh',n:'Viransh',s:'Bandiguptapu',pa:['satya','sarada'],sp:[],ch:[]},{id:'narasappa',n:'Narasappa',s:'Bandi / Bandiguptapu tradition',p:'Peddapuram → Devaguptam',o:'Senadhipathi (family tradition)',pa:[],sp:[],ch:[],note:'Family genealogy records the tradition that Narasappa came from Peddapuram Fort to Devaguptam Fort as a military commander. Exact connection to the later documented branch remains unverified.'}];let people;try{people=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){people=seed}let cur='satya';const by=id=>people.find(x=>x.id===id),full=p=>[p.n,p.s].filter(Boolean).join(' ');function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}render()}function gen(p,seen=new Set()){if(!p||!p.pa?.length||seen.has(p.id))return 0;seen.add(p.id);return 1+Math.max(...p.pa.map(x=>gen(by(x),new Set(seen))).filter(Number.isFinite),-1)}function groups(){let m={};people.forEach(p=>(m[gen(p)]??=[]).push(p));return m}function select(id){cur=id;render();setTimeout(()=>document.querySelector('.sel')?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}),50)}function render(){let p=by(cur)||people[0];document.getElementById('hero').innerHTML=`<div class="muted">Selected person</div><h1>${full(p)}</h1><div class="muted">${[p.d,p.p,p.o].filter(Boolean).join(' • ')||'Family member'}</div><div class="rels"><button class="btn" onclick="openAdd('parent')">＋ Parent</button><button class="btn" onclick="openAdd('spouse')">＋ Spouse</button><button class="btn primary" onclick="openAdd('child')">＋ Child</button><button class="btn" onclick="openAdd('none')">＋ Person</button></div>${p.g?`<p><b>Gotram:</b> ${p.g}</p>`:''}${p.de?`<p><b>Family deity:</b> ${p.de}</p>`:''}${p.note?`<p class="muted">${p.note}</p>`:''}`;let gs=groups(),ks=Object.keys(gs).map(Number).sort((a,b)=>a-b);document.getElementById('chips').innerHTML=ks.map(k=>`<button class="chip" onclick="document.getElementById('g${k}').scrollIntoView({behavior:'smooth'})">Generation ${k+1} · ${gs[k].length}</button>`).join('');document.getElementById('tree').innerHTML=ks.map(k=>`<section class="gen" id="g${k}"><h3>Generation ${k+1}</h3><div class="row">${gs[k].map(x=>`<button class="card ${x.id===cur?'sel':''}" onclick="select('${x.id}')"><b>${full(x)}</b><small>${[x.d,x.o,x.p].filter(Boolean).join(' • ')||'Family member'}</small></button>`).join('')}</div></section>`).join('')}function home(){select('satya')}function openAdd(r){document.getElementById('rel').value=r;document.getElementById('modal').classList.add('show')}function closeAdd(){document.getElementById('modal').classList.remove('show');document.getElementById('form').reset()}document.getElementById('form').onsubmit=e=>{e.preventDefault();let id='p'+Date.now(),n={id,n:name.value.trim(),s:surname.value.trim(),d:dob.value.trim(),p:place.value.trim(),o:occupation.value.trim(),g:gotram.value.trim(),de:deity.value.trim(),note:notes.value.trim(),pa:[],sp:[],ch:[]},t=by(cur),r=rel.value;if(r==='child'){n.pa.push(t.id);t.ch??=[];t.ch.push(id)}if(r==='parent'){n.ch.push(t.id);t.pa??=[];t.pa.push(id)}if(r==='spouse'){n.sp.push(t.id);t.sp??=[];t.sp.push(id)}people.push(n);cur=id;save();closeAdd()};document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase().trim();if(!q)return;let p=people.find(x=>JSON.stringify(x).toLowerCase().includes(q));if(p)select(p.id)};render();</script></body></html>
