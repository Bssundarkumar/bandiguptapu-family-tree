<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d16"><title>Bandiguptapu Family</title><style>html,body{margin:0;background:#070b12;color:#f7f8fa;font-family:system-ui,-apple-system,sans-serif;min-height:100%}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spinner{width:44px;height:44px;border:4px solid #253046;border-top-color:#e8bc72;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#96a1b3}</style></head><body><div class="boot"><div><div class="spinner"></div><h2>Loading Bandiguptapu Family Tree</h2><small>Preparing all family records…</small></div></div><script>(async()=>{try{const r=await fetch('app-v4.gz',{cache:'no-store'});if(!r.ok)throw new Error('app');const ds=new DecompressionStream('gzip');const text=await new Response(r.body.pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><h2>Unable to load the family tree</h2><small>Please refresh the page in Safari or Chrome.</small></div></div>'}})();</script></body></html>
