<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d16"><title>Bandiguptapu Family</title><style>html,body{margin:0;background:#070b12;color:#f7f8fa;font-family:system-ui,-apple-system,sans-serif;min-height:100%}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spinner{width:44px;height:44px;border:4px solid #253046;border-top-color:#e8bc72;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#96a1b3}</style></head><body><div class="boot"><div><div class="spinner"></div><h2>Loading Bandiguptapu Family Tree</h2><small>Preparing PDF hierarchy and family relationships…</small></div></div><script>(async()=>{try{const names=Array.from({length:8},(_,i)=>`app-parts/part-${String(i).padStart(2,'0')}.txt?v=16`);const parts=[];for(const name of names){const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);parts.push(await r.text())}document.open();document.write(parts.join('')+'<script src="family-patch.js?v=16"><\/script><script src="relationship-integrity.js?v=16"><\/script><script src="origin-relationships.js?v=16"><\/script><script src="pdf-hierarchy.js?v=16"><\/script><script src="theme-modern.js?v=16"><\/script>');document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><h2>Unable to load the family tree</h2><small>Deployment files are still syncing. Please refresh in a minute.</small></div></div>';console.error(e)}})();</script></body></html>
